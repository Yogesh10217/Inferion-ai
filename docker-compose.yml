services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: llm-inference-engine-app
    restart: unless-stopped
    ports:
      - "${PORT:-8002}:${PORT:-8002}"
    environment:
      - HOST=${HOST:-0.0.0.0}
      - PORT=${PORT:-8002}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434}
      - DEFAULT_PROVIDER=${DEFAULT_PROVIDER:-openai}
      - DEFAULT_MODEL=${DEFAULT_MODEL:-gpt-4o-mini}
    depends_on:
      ollama:
        condition: service_started
    networks:
      - inference-network

  ollama:
    image: ollama/ollama:0.1.48
    container_name: llm-inference-engine-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama-storage:/root/.ollama
    networks:
      - inference-network

  # -------------------------------------------------------------
  # Future Placeholders (Production Add-ons / Observability)
  # Uncomment the sections below when moving to Phase 2.
  # -------------------------------------------------------------
  
  # redis:
  #   image: redis:7.2.4-alpine
  #   container_name: llm-inference-engine-cache
  #   restart: unless-stopped
  #   ports:
  #     - "6379:6379"
  #   volumes:
  #     - redis-storage:/data
  #   networks:
  #     - inference-network

  prometheus:
    image: prom/prometheus:v2.51.1
    container_name: llm-inference-engine-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./monitoring/prometheus/recording_rules.yml:/etc/prometheus/recording_rules.yml:ro
      - prometheus-storage:/prometheus
    networks:
      - inference-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 3

  grafana:
    image: grafana/grafana:10.4.1
    container_name: llm-inference-engine-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - inference-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  ollama-storage:
    name: llm-inference-engine-ollama-storage
  # redis-storage:
  prometheus-storage:
  grafana-storage:

networks:
  inference-network:
    driver: bridge
    name: llm-inference-network
