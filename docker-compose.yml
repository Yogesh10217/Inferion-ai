version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: llm-inference-engine-app
    restart: unless-stopped
    ports:
      - "${PORT:-8002}:${PORT:-8002}"
    environment:
      - HOST=${HOST:-0.0.0.0}
      - PORT=${PORT:-8002}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434}
      - DEFAULT_PROVIDER=${DEFAULT_PROVIDER:-openai}
      - DEFAULT_MODEL=${DEFAULT_MODEL:-gpt-4o-mini}
    depends_on:
      ollama:
        condition: service_started
    networks:
      - inference-network

  ollama:
    image: ollama/ollama:0.1.48
    container_name: llm-inference-engine-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama-storage:/root/.ollama
    networks:
      - inference-network

