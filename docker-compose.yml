services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: inferion-ai-app
    restart: unless-stopped
    ports:
      - "${PORT:-8002}:${PORT:-8002}"
    environment:
      - ENVIRONMENT=STAGING
      - DEBUG=false
      - HOST=${HOST:-0.0.0.0}
      - PORT=${PORT:-8002}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - AUTH_ENABLED=${AUTH_ENABLED:-true}
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://postgres:postgres@db:5432/llm_engine}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - inference-network

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: inferion-ai-worker
    command: ["python", "-m", "app.jobs.job_worker"]
    restart: unless-stopped
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://postgres:postgres@db:5432/llm_engine}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - inference-network

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: inferion-ai-scheduler
    command: ["python", "-m", "app.jobs.job_scheduler"]
    restart: unless-stopped
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://postgres:postgres@db:5432/llm_engine}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - inference-network

  db:
    image: postgres:16-alpine
    container_name: inferion-ai-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=llm_engine
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres-storage:/var/lib/postgresql/data
    networks:
      - inference-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2.4-alpine
    container_name: inferion-ai-redis
    restart: unless-stopped
    ports:
      - "6380:6379"

    volumes:
      - redis-storage:/data
    networks:
      - inference-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:v2.51.1
    container_name: inferion-ai-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./monitoring/prometheus/recording_rules.yml:/etc/prometheus/recording_rules.yml:ro
      - prometheus-storage:/prometheus
    networks:
      - inference-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 3

  grafana:
    image: grafana/grafana:10.4.1
    container_name: inferion-ai-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - inference-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: inferion-ai-alertmanager
    restart: unless-stopped
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-storage:/alertmanager
    networks:
      - inference-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9093/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  postgres-storage:
  redis-storage:
  prometheus-storage:
  grafana-storage:
  alertmanager-storage:

networks:
  inference-network:
    driver: bridge
    name: inferion-ai-network
