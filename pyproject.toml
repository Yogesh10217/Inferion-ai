[project]
name = "llm-inference-engine"
version = "0.1.0"
description = "Production-grade inference engine for serving large language models at scale"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.0.0",
  "httpx>=0.27.0",
  "requests>=2.31.0",
  "python-dotenv>=1.0.0",
  "sqlalchemy>=2.0.0",
  "aiosqlite>=0.20.0",
  "PyJWT>=2.8.0",
  "passlib[bcrypt]>=1.7.4",
  "tiktoken>=0.5.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "pytest-cov>=5.0.0",
  "httpx>=0.27.0",
  "black>=24.4.0",
  "ruff>=0.4.0",
  "pre-commit>=3.7.0",
  "pip-audit>=2.7.0",
]

[tool.black]
line-length = 120
target-version = ['py310', 'py311']
include = '\.pyi?$'

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = []

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
