[project]
name = "llm-inference-engine"
version = "0.1.0"
description = "Production-grade inference engine for serving large language models at scale"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.0.0",
  "httpx>=0.27.0",
  "requests>=2.31.0",
  "python-dotenv>=1.0.0",
  "sqlalchemy>=2.0.0",
  "aiosqlite>=0.20.0",
  "alembic>=1.20.0",
  "psycopg2-binary>=2.9.9",
  "redis>=5.0.3",
  "asyncpg>=0.29.0",
  "prometheus-client>=0.20.0",
  "python-multipart>=0.0.9",
  "PyJWT>=2.8.0",
  "passlib[bcrypt]>=1.7.4",
  "tiktoken>=0.5.0",
  "opentelemetry-api>=1.24.0",
  "opentelemetry-sdk>=1.24.0",
  "opentelemetry-exporter-otlp>=1.24.0",
  "psutil>=5.9.0",
  "nest-asyncio>=1.6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "pytest-cov>=5.0.0",
  "httpx>=0.27.0",
  "black>=24.4.0",
  "ruff>=0.4.0",
  "pre-commit>=3.7.0",
  "pip-audit>=2.7.0",
]
knowledge = [
  "pymupdf>=1.24.0",
  "python-docx>=1.1.0",
  "openai>=1.30.0",
  "cohere>=5.5.0",
  "sentence-transformers>=3.0.0",
  "chromadb>=0.5.0",
  "qdrant-client>=1.9.0",
  "boto3>=1.34.0",
]

[tool.black]
line-length = 120
target-version = ['py310', 'py311']
include = '\.pyi?$'

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
