# Default values for llm-engine Helm Chart (Production Grade)

replicaCount: 3

gateway:
  replicaCount: 3
  resources:
    limits:
      cpu: 2000m
      memory: 4Gi
    requests:
      cpu: 500m
      memory: 1Gi

scheduler:
  enabled: true
  replicaCount: 2
  resources:
    limits:
      cpu: 1000m
      memory: 2Gi
    requests:
      cpu: 250m
      memory: 512Mi

securityContext:
  runAsNonRoot: true
  runAsUser: 10001
  fsGroup: 10001

containerSecurityContext:
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

image:
  repository: llm-inference-engine
  pullPolicy: IfNotPresent
  tag: "1.0.0"

serviceAccount:
  create: true
  name: "llm-engine-sa"

service:
  type: ClusterIP
  port: 8000
  targetPort: 8000

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
  hosts:
    - host: api.inferion.ai
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: inferion-tls-cert
      hosts:
        - api.inferion.ai

resources:
  limits:
    cpu: 2000m
    memory: 4Gi
  requests:
    cpu: 500m
    memory: 1Gi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 20
  targetCPUUtilizationPercentage: 75
  targetMemoryUtilizationPercentage: 80

podDisruptionBudget:
  enabled: true
  minAvailable: 2

pdb:
  enabled: true
  minAvailable: 2

rbac:
  create: true

persistence:
  enabled: true
  size: 10Gi
  accessMode: ReadWriteOnce

env:
  ENVIRONMENT: "production"
  PORT: "8000"
  LOG_LEVEL: "INFO"
  SECRET_MANAGER_BACKEND: "vault" # vault, aws_secrets_manager, environment
  VAULT_ADDR: "http://vault.secrets.svc.cluster.local:8200"
  AWS_REGION: "us-east-1"
  ENABLE_CIRCUIT_BREAKER: "true"
  ENABLE_RATE_LIMITING: "true"

highAvailability:
  postgresql:
    mode: "ha_cluster"
    primaryHost: "postgres-primary.database.svc.cluster.local"
    replicaHosts:
      - "postgres-replica-1.database.svc.cluster.local"
      - "postgres-replica-2.database.svc.cluster.local"
    port: 5432
    maxConnections: 200
  redis:
    mode: "sentinel"
    masterName: "mymaster"
    sentinelEndpoints:
      - "redis-sentinel-1.redis.svc.cluster.local:26379"
      - "redis-sentinel-2.redis.svc.cluster.local:26379"
      - "redis-sentinel-3.redis.svc.cluster.local:26379"

healthCheck:
  livenessProbe:
    httpGet:
      path: /health
      port: 8000
    initialDelaySeconds: 15
    periodSeconds: 10
  readinessProbe:
    httpGet:
      path: /health
      port: 8000
    initialDelaySeconds: 5
    periodSeconds: 5

observability:
  serviceMonitor:
    enabled: true
  podMonitor:
    enabled: true
  prometheusRule:
    enabled: true

networkPolicy:
  enabled: true

priorityClass:
  create: true
  value: 100000
