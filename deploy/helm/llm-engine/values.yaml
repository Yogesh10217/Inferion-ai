replicaCount: 3

image:
  repository: ghcr.io/org/llm-engine
  tag: "1.0.0"
  pullPolicy: IfNotPresent
  imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

gateway:
  enabled: true
  replicaCount: 3
  resources:
    requests:
      cpu: "500m"
      memory: "512Mi"
    limits:
      cpu: "2000m"
      memory: "2Gi"
  probes:
    liveness:
      httpGet:
        path: /health
        port: 8000
      initialDelaySeconds: 10
      periodSeconds: 10
    readiness:
      httpGet:
        path: /health
        port: 8000
      initialDelaySeconds: 5
      periodSeconds: 5
    startup:
      httpGet:
        path: /health
        port: 8000
      failureThreshold: 30
      periodSeconds: 2

scheduler:
  enabled: true
  replicaCount: 1
  resources:
    requests:
      cpu: "250m"
      memory: "256Mi"
    limits:
      cpu: "1000m"
      memory: "1Gi"
  leaderElection:
    enabled: true
    leaseName: "llm-scheduler-lease"

service:
  type: ClusterIP
  port: 80
  targetPort: 8000
  sessionAffinity: None

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
  hosts:
    - host: api.gateway.llm.internal
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: llm-gateway-tls
      hosts:
        - api.gateway.llm.internal

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 20
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

pdb:
  enabled: true
  minAvailable: 2

networkPolicy:
  enabled: true
  ingress:
    enabled: true
  egress:
    enabled: true

serviceAccount:
  create: true
  name: "llm-engine-sa"

rbac:
  create: true

priorityClass:
  create: true
  value: 1000000

observability:
  prometheusRule:
    enabled: true
  serviceMonitor:
    enabled: true
  podMonitor:
    enabled: true
