apiVersion: v1
kind: Secret
metadata:
  name: llm-engine-secrets
  namespace: llm-engine
type: Opaque
stringData:
  JWT_SECRET: "replace-with-secure-production-jwt-secret-key-32bytes"
  DATABASE_URL: "postgresql+asyncpg://user:password@pg-host:5432/llm_engine"
  REDIS_URL: "redis://redis-host:6379"
  OPENAI_API_KEY: "sk-proj-example-production-key"
