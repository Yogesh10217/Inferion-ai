apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: llm-engine-network-policy
  namespace: llm-engine
spec:
  podSelector:
    matchLabels:
      app: llm-engine
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow ingress from Ingress Controller / Service Mesh
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        - podSelector:
            matchLabels:
              tier: ingress
      ports:
        - protocol: TCP
          port: 8002
    # Allow Prometheus monitoring scrapes
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 8002
  egress:
    # Allow egress to PostgreSQL & Redis in llm-engine namespace
    - to:
        - podSelector:
            matchLabels:
              tier: database
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 6379
    # Allow DNS resolution
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
    # Allow egress to External LLM Provider APIs over HTTPS (443)
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
