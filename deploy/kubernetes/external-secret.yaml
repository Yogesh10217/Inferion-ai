apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: llm-engine-external-secrets
  namespace: llm-engine
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: llm-engine-secrets
    creationPolicy: Owner
  data:
    - secretKey: JWT_SECRET_KEY
      remoteRef:
        key: secret/data/llm-engine/production
        property: JWT_SECRET_KEY
    - secretKey: OPENAI_API_KEY
      remoteRef:
        key: secret/data/llm-engine/providers
        property: OPENAI_API_KEY
    - secretKey: DATABASE_URL
      remoteRef:
        key: secret/data/llm-engine/database
        property: DATABASE_URL
