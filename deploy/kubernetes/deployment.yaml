apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-engine-app
  namespace: llm-engine
  labels:
    app: llm-engine
    tier: api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: llm-engine
      tier: api
  template:
    metadata:
      labels:
        app: llm-engine
        tier: api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: app
          image: llm-inference-engine:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8002
              name: http
          envFrom:
            - configMapRef:
                name: llm-engine-config
            - secretRef:
                name: llm-engine-secrets
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          readinessProbe:
            httpGet:
              path: /v1/health
              port: 8002
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /v1/live
              port: 8002
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
