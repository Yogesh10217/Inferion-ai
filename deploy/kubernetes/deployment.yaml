apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-engine-app
  namespace: llm-engine
  labels:
    app: llm-engine
    tier: api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: llm-engine
      tier: api
  template:
    metadata:
      labels:
        app: llm-engine
        tier: api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: ghcr.io/inferion-ai/llm-inference-engine:v1.0.0@sha256:d8b76a9c1e2f4a5b6c7d8e9f0a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8002
              name: http
          envFrom:
            - configMapRef:
                name: llm-engine-config
            - secretRef:
                name: llm-engine-secrets
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          readinessProbe:
            httpGet:
              path: /v1/health
              port: 8002
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /v1/live
              port: 8002
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
