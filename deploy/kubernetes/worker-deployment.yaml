apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-engine-worker
  namespace: llm-engine
  labels:
    app: llm-engine
    tier: worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: llm-engine
      tier: worker
  template:
    metadata:
      labels:
        app: llm-engine
        tier: worker
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: worker
          image: llm-inference-engine:latest
          command: ["python", "-m", "app.jobs.job_worker"]
          envFrom:
            - configMapRef:
                name: llm-engine-config
            - secretRef:
                name: llm-engine-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
