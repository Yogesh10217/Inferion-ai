apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: llm-engine-ingress
  namespace: llm-engine
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
    - hosts:
        - api.llm-engine.example.com
      secretName: llm-engine-tls
  rules:
    - host: api.llm-engine.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: llm-engine-service
                port:
                  number: 8002
