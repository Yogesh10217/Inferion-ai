name: SDK Build and Publish
on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'

jobs:
  build-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Test Python SDK
        run: |
          cd sdk/python
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
          python -m pytest tests/

  build-typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      - name: Test TypeScript SDK
        run: |
          cd sdk/typescript
          npm test

  build-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'
      - name: Test Go SDK
        run: |
          cd sdk/go
          go mod tidy
          go vet ./...
          go test ./...
