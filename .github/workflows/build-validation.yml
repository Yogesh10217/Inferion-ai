name: Build & Infrastructure Validation

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:
  docker-build-and-smoke-test:
    name: Docker Build & Container Smoke Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Explicitly Build Docker Image
        run: |
          docker build -t llm-inference-engine:test .

      - name: Verify Docker Image Exists
        run: |
          docker image inspect llm-inference-engine:test

      - name: Smoke Test Container Readiness & Liveness
        run: |
          docker run -d --name engine-smoke -e PORT=8000 -p 8000:8000 llm-inference-engine:test

          # Register trap cleanup for signal/exit guarantees
          trap 'echo "=== Container Logs ==="; docker logs engine-smoke || true; docker rm -f engine-smoke || true' EXIT

          echo "Waiting for container readiness at http://localhost:8000/v1/health..."
          for i in {1..30}; do
            if curl -fsS http://localhost:8000/v1/health; then
              echo "Container readiness check passed successfully on attempt $i!"
              exit 0
            fi
            sleep 2
          done

          echo "Container failed readiness check within timeout period."
          exit 1

  helm-and-kubernetes-validation:
    name: Helm & Kubeconform Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: "v3.12.0"

      - name: Lint & Template Helm Charts
        run: |
          helm lint deploy/helm/llm-engine
          helm template test-release deploy/helm/llm-engine
          for chart in infra/helm/* deploy/helm/*; do
            if [ -d "$chart" ]; then
              echo "Linting chart $chart..."
              helm lint "$chart"
            fi
          done

      - name: Validate Kubernetes Manifests with Kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.3/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/
          find infra deploy -name "*.yaml" -o -name "*.yml" 2>/dev/null | xargs kubeconform -strict -summary
