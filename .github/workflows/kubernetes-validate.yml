name: Kubernetes Manifest Validation
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Helm & Kubeconform Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: "v3.12.0"

      - name: Lint Helm Charts
        run: |
          for chart in infra/helm/* deploy/helm/*; do
            if [ -d "$chart" ]; then
              echo "Linting chart $chart..."
              helm lint "$chart" || true
            fi
          done

      - name: Validate Kubernetes Manifests with Kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.3/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/
          find infra deploy -name "*.yaml" -o -name "*.yml" 2>/dev/null | xargs kubeconform -strict -summary || true
