name: Docker Build & Test
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: llm-inference-engine:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke Test Image Liveness
        run: |
          docker run -d --name engine-smoke -e PORT=8000 -p 8000:8000 llm-inference-engine:test
          sleep 3
          docker logs engine-smoke
          docker rm -f engine-smoke
