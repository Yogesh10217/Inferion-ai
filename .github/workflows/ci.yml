name: Continuous Integration & Quality Gates

on:
  pull_request:
    branches: [ main, master, develop ]
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  test-python-platform:
    name: Lint & Test Platform (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
          pip install pytest pytest-cov pytest-asyncio flake8 black pip-audit

      - name: Code Formatting Check (Black)
        run: |
          black --check app/

      - name: Flake8 Linting
        run: |
          flake8 app/ --max-line-length=160 --ignore=E501,W503,E203,F841,E704,E741,W291,E712,E302,E303,W293

      - name: Run Full Test Suite with Coverage Gate
        run: |
          PYTHONPATH="${PYTHONPATH}:." pytest tests/ -v --cov=app --cov-report=xml --cov-fail-under=60

      - name: Upload Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-python-${{ matrix.python-version }}
          path: coverage.xml

  sdk-python-validation:
    name: Validate Python SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Test Python SDK
        run: |
          cd sdk/python
          python -m pip install --upgrade pip build twine
          python -m pip install -e ".[test]"
          python -m pytest tests/
      - name: Build Package
        run: |
          cd sdk/python
          python -m build

  sdk-typescript-validation:
    name: Validate TypeScript SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          registry-url: 'https://registry.npmjs.org'
      - name: Install & Test TypeScript SDK
        run: |
          cd sdk/typescript
          npm ci
          npm run build
          npm test

  sdk-go-validation:
    name: Validate Go SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - name: Test Go SDK
        run: |
          cd sdk/go
          go mod tidy
          go vet ./...
          go test ./...
