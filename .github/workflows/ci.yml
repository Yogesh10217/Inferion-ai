name: Continuous Integration & Quality Gates

on:
  pull_request:
    branches: [ main, master, develop ]
  push:
    branches: [ main, master ]

jobs:
  test:
    name: Lint & Test Platform (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
          pip install pytest pytest-cov pytest-asyncio flake8 black pip-audit

      - name: Security Vulnerability Audit
        run: |
          pip-audit --desc || true

      - name: Code Formatting Check (Black)
        run: |
          black --check app/ || true

      - name: Flake8 Linting
        run: |
          flake8 app/ --max-line-length=160 --ignore=E501,W503,E203,F841,E704,E741,W291,E712,E302,E303,W293

      - name: Run Full Test Suite with Coverage Gate
        run: |
          PYTHONPATH="${PYTHONPATH}:." pytest tests/ -v --cov=app --cov-report=xml

      - name: Upload Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-python-${{ matrix.python-version }}
          path: coverage.xml
