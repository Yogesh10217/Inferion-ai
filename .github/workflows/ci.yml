name: Continuous Integration & Quality Gates

on:
  pull_request:
    branches: [ main, master, develop ]
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  test-python-platform:
    name: Lint & Test Platform (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e ".[knowledge]"
          pip install pytest pytest-cov pytest-asyncio ruff pyright alembic

      - name: Ruff Linter & Formatter Check
        run: |
          ruff check app/
          ruff format --check app/

      - name: Static Type Check (Pyright)
        run: |
          pyright app/ --level warning

      - name: Alembic Schema Drift Check
        run: |
          alembic check

      - name: Run Full Test Suite with Coverage Gate (80%)
        run: |
          PYTHONPATH="${PYTHONPATH}:." pytest tests/ -v --cov=app --cov-report=xml --cov-fail-under=80

      - name: Upload Coverage Artifact
        uses: actions/upload-artifact@v7
        with:
          name: code-coverage-python-${{ matrix.python-version }}
          path: coverage.xml

  sdk-python-validation:
    name: Validate Python SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Test Python SDK
        run: |
          cd sdk/python
          python -m pip install --upgrade pip build twine
          python -m pip install -e ".[test]"
          python -m pytest tests/
      - name: Build Package
        run: |
          cd sdk/python
          python -m build

  sdk-typescript-validation:
    name: Validate TypeScript SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          registry-url: 'https://registry.npmjs.org'
      - name: Install & Test TypeScript SDK
        run: |
          cd sdk/typescript
          npm ci
          npm run build
          npm test

  sdk-go-validation:
    name: Validate Go SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - name: Test Go SDK
        run: |
          cd sdk/go
          go mod tidy
          go vet ./...
          go test ./...

  sdk-java-validation:
    name: Validate Java SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build with Maven
        run: |
          cd sdk/java
          mvn clean test
